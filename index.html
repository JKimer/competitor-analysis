<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Restricted &middot; Competitor Analysis</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0b2138;color:#15263b}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,#0b2138 0%,#103a52 55%,#0e6e74 100%);z-index:1000}
  .box{width:100%;max-width:410px;background:#fff;border-radius:16px;padding:32px 30px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
  .eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:800;color:#0e8f93}
  .box h1{font-size:21px;color:#0c2340;margin:8px 0 4px}
  .box p.sub{font-size:13.5px;color:#5b6b80;margin:0 0 18px;line-height:1.5}
  label{font-size:12px;font-weight:700;color:#0c2340;display:block;margin:14px 0 5px;letter-spacing:.02em}
  input{width:100%;padding:12px;border:1px solid #d8dfe8;border-radius:10px;font-size:15px;color:#15263b}
  input:focus{outline:none;border-color:#0e8f93;box-shadow:0 0 0 3px rgba(14,143,147,.16)}
  button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:10px;background:#0c2340;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  button:hover{background:#103a52}
  .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:18px;font-weight:600}
  .note{font-size:11.5px;color:#8090a2;margin-top:16px;line-height:1.55;border-top:1px solid #eef2f8;padding-top:12px}
  #app{display:none}
  body.unlocked #app{display:block}
</style>
</head>
<body>
<div id="gate">
  <form class="box" id="loginForm" autocomplete="off">
    <div class="eyebrow">Restricted access</div>
    <h1>Restricted report</h1>
    <p class="sub">Enter your company email and the access password to open the report.</p>
    <label for="email">Company email</label>
    <input id="email" type="email" placeholder="name@company.com" autocomplete="off" spellcheck="false" required>
    <label for="pw">Access password</label>
    <input id="pw" type="password" placeholder="Access password" autocomplete="off" required>
    <button type="submit">Unlock report</button>
    <div class="err" id="err" role="alert"></div>
    <div class="note">Access is restricted to authorized colleagues. The report is AES-256 encrypted and stays locked until the correct password is entered. Please do not share the password.</div>
  </form>
</div>

  function b64ToBytes(b64){var bin=atob(b64);var n=bin.length;var a=new Uint8Array(n);for(var i=0;i<n;i++){a[i]=bin.charCodeAt(i);}return a;}
  async function deriveKey(pw,salt,iter){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  }
  async function decryptReport(pw){
    var key=await deriveKey(pw,b64ToBytes(SALT_B64),ITER);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(IV_B64)},key,b64ToBytes(CT_B64));
    return new TextDecoder().decode(pt);
  }
  function initFilters(){
    var sel=document.getElementById("filterSelect");
    var cards=document.querySelectorAll("#cards .ccard, #oems .ccard");
    if(!sel){return;}
    sel.addEventListener("change",function(){
      var f=sel.value;
      cards.forEach(function(card){
        var cats=card.getAttribute("data-cats")||"";
        card.style.display=(f==="all"||cats.split(" ").indexOf(f)!==-1)?"":"none";
      });
    });
  }
  var EMAIL_RE=/^[^@\s]+@([a-z0-9-]+\.)*prenaital\.com$/i;
  function showErr(m){document.getElementById("err").textContent=m;}
  document.getElementById("loginForm").addEventListener("submit",async function(e){
    e.preventDefault();
    var email=document.getElementById("email").value.trim();
    var pw=document.getElementById("pw").value;
    if(!EMAIL_RE.test(email)){showErr("Please use your authorized company email address.");return;}
    if(!window.crypto||!window.crypto.subtle){showErr("This browser cannot decrypt the report. Open it over https.");return;}
    showErr("Unlocking...");
    try{
      var html=await decryptReport(pw);
      document.getElementById("app").innerHTML=html;
      document.body.classList.add("unlocked");
      document.getElementById("gate").style.display="none";
      document.title="Competitor Analysis: AI in Prenatal Ultrasound";
      initFilters();
      window.scrollTo(0,0);
    }catch(err){showErr("Incorrect password. Please try again.");}
  });
  document.getElementById("email").focus();
